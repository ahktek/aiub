services:
  web:
    image: php:8.2-apache
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=db
      - DB_NAME=ecommerce_lab
      - DB_USER=root
      - DB_PASS=root
    depends_on:
      - db
    # Install pdo_mysql and set permissions for uploads
    command: >
      bash -c "docker-php-ext-install pdo pdo_mysql && mkdir -p public/uploads/products && chown -R www-data:www-data public/uploads && apache2-foreground"

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecommerce_lab
    volumes:
      - db_data:/var/lib/mysql
      # Automatically run our schema on startup
      - ./config/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  db_data:
